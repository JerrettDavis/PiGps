name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PR
        run: |
          # Auto-merge only queues the merge until required checks pass; GitHub can
          # report "unstable status" while checks are still starting. Retry with
          # backoff, and never fail the workflow if it still cannot be enabled.
          for attempt in 1 2 3 4 5; do
            if gh pr merge --auto --squash "$PR_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              delay=$((attempt * 15))
              echo "Attempt $attempt failed; retrying in ${delay}s..."
              sleep "$delay"
            fi
          done
          echo "::warning::Could not enable auto-merge for $PR_URL after 5 attempts (checks may still be in progress)."
          exit 0
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
